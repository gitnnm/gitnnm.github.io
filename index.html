        function displayChannels(filterText) {
            const grid = document.getElementById('channelsGrid');
            const filtered = filterText 
                ? channelsData.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()))
                : channelsData;
            
            grid.innerHTML = filtered.map(c => `
                <div class="channel-item">
                    <div class="channel-name">${c.name}</div>
                    <div class="channel-meta">
                        <span class="source-badge">${c.source}</span>
                        ${c.programsCount} программ
                    </div>
                </div>
            `).join('');
        }
        
        function filterChannels() {
            displayChannels(document.getElementById('searchBox').value);
        }
        
        function toggleSpoiler() {
            const content = document.getElementById('spoilerContent');
            const icon = document.getElementById('spoilerIcon');
            if (content.classList.contains('active')) {
                content.classList.remove('active');
                icon.textContent = '▶';
            } else {
                content.classList.add('active');
                icon.textContent = '▼';
                displayChannels('');
            }
        }
    </script>
