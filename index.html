        * {

            padding: 0;

        }
        
        body {

            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);

            padding: 24px;
            color: #1a1a2e;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo-icon {
            font-size: 28px;
        }
        
        .logo-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        h1 {
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }
        
        /* Main Card */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 24px;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .stat-value {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .stat-label {
            font-size: 15px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        /* File Info */
        .file-info {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 24px;
            border-radius: 20px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }
        
        .file-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .file-icon {
            font-size: 28px;
        }
        
        .file-name {
            font-size: 20px;
            font-weight: 600;
        }
        
        .file-details {
            display: flex;
            gap: 24px;
            font-size: 14px;
            opacity: 0.95;
        }
        
        .file-detail {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            color: #f5576c;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* Channels Section */
        .channels-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .channels-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .channels-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .channels-count {
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .spoiler-btn {
            background: #f0f0f5;
            border: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            width: 100%;
            justify-content: center;
        }
        
        .spoiler-btn:hover {
            background: #e0e0e8;
        }
        
        .spoiler-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        
        .spoiler-content.active {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .search-box {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e8;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 16px;
            transition: border-color 0.2s ease;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .channel-item {
            background: #f8f8fc;
            padding: 14px 16px;
            border-radius: 14px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .channel-item:hover {
            background: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .channel-name {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 15px;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        
        /* Arrow icon rotation */
        .spoiler-btn .arrow {
            transition: transform 0.3s ease;
        }
        
        .spoiler-btn.active .arrow {
            transform: rotate(180deg);
        }
        
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            
            h1 {
                font-size: 32px;
            }

                padding: 24px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .file-details {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

                text.textContent = 'Показать все каналы';
            } else {
                content.classList.add('active');
                btn.classList.add('active');
                text.textContent = 'Скрыть каналы';
                displayChannels('');
            }
        }
    </script>
</body>
</html>
