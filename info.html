<!DOCTYPE html>
<html>
<head>
    <title>Информация об обновлениях</title>
    <style>
        .update-info {
            margin: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Последние обновления XMLTV</h1>
    <div id="updateInfo">Загрузка...</div>

    <script>
        // Замените на ваши данные
        const repoOwner = 'gitnnm';
        const repoName = 'gitnnm.github.io';
        const filePath = 'epg.xml.gz';
        
        async function loadUpdateInfo() {
            try {
                // Получаем информацию о коммитах для конкретного файла
                const response = await fetch(
                    `https://api.github.com/repos/${repoOwner}/${repoName}/commits?path=${filePath}&per_page=1`
                );
                const commits = await response.json();
                
                if (commits.length > 0) {
                    const lastCommit = commits[0];
                    const commitDate = new Date(lastCommit.commit.committer.date);
                    
                    // Получаем информацию о файле
                    const fileResponse = await fetch(
                        `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`
                    );
                    const fileInfo = await fileResponse.json();
                    
                    document.getElementById('updateInfo').innerHTML = `
                        <div class="update-info">
                            <h3>Файл: ${filePath}</h3>
                            <p><strong>Последнее обновление:</strong> ${commitDate.toLocaleString()}</p>
                            <p><strong>Размер файла:</strong> ${(fileInfo.size / 1024 / 1024).toFixed(2)} MB</p>
                            <p><strong>Коммит:</strong> ${lastCommit.commit.message}</p>
                            <p><strong>Хэш:</strong> ${lastCommit.sha.substring(0, 7)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('updateInfo').innerHTML = 'Ошибка загрузки данных';
                console.error(error);
            }
        }
        
        loadUpdateInfo();
    </script>
</body>
  </html>
