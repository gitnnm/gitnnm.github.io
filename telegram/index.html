<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram архивы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px 15px 0 0;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1:before {
            content: '📁';
            font-size: 1.2em;
        }

        .stats-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 20px 0;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            border: 1px solid #e9ecef;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;
            background: #e8f5e9;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .update-time {
            color: #6c757d;
            font-size: 0.9em;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .update-time:before {
            content: '🕐';
            font-size: 1.1em;
        }

        .channels-grid {
            background: white;
            padding: 30px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .channel-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .channel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: #0088cc;
        }

        .channel-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0088cc, #00a3e0);
        }

        .channel-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .channel-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0088cc, #00a3e0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(0,136,204,0.3);
        }

        .channel-info h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .channel-folder {
            color: #6c757d;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .channel-folder:before {
            content: '📂';
            font-size: 0.9em;
        }

        .years-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .year-card {
            flex: 1 1 auto;
            min-width: 140px;
        }

        .year-link {
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            height: 100%;
        }

        .year-link:hover {
            background: #0088cc;
            border-color: #0088cc;
            transform: scale(1.02);
        }

        .year-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #0088cc;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .year-link:hover .year-number {
            color: white;
        }

        .year-stats {
            font-size: 0.85em;
            color: #6c757d;
            display: flex;
            justify-content: space-between;
            transition: color 0.3s;
        }

        .year-link:hover .year-stats {
            color: rgba(255,255,255,0.9);
        }

        .message-count {
            background: #e9ecef;
            padding: 3px 8px;
            border-radius: 15px;
            transition: background 0.3s;
        }

        .year-link:hover .message-count {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state:before {
            content: '📭';
            font-size: 4em;
            display: block;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
        }

        .footer a {
            color: white;
            text-decoration: none;
            border-bottom: 1px dotted rgba(255,255,255,0.5);
        }

        .footer a:hover {
            border-bottom-color: white;
        }

        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #0088cc;
            animation: spin 1s ease-in-out infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .stats-panel {
                flex-direction: column;
                gap: 15px;
            }
            
            .update-time {
                margin-left: 0;
            }
            
            .year-card {
                min-width: calc(50% - 6px);
            }
        }

        .api-badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 15px;
        }

        .raw-link {
            display: inline-block;
            margin-top: 10px;
            color: #0088cc;
            text-decoration: none;
            font-size: 0.9em;
        }

        .raw-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>Telegram архивы</h1>
            <p style="color: #6c757d;">Автоматически собранные сообщения из Telegram каналов</p>
            
            <div class="stats-panel" id="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">Каналов</span>
                    <span class="stat-value" id="channels-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Файлов</span>
                    <span class="stat-value" id="files-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Сообщений</span>
                    <span class="stat-value" id="messages-count">0</span>
                </div>
                <div class="update-time" id="update-time">
                    Загрузка...
                </div>
            </div>
        </div>

        <!-- Сетка каналов -->
        <div class="channels-grid" id="channels-container">
            <div style="text-align: center;">
                <div class="loading"></div>
                <p style="color: #6c757d; margin-top: 20px;">Загрузка архивов...</p>
            </div>
        </div>

        <!-- Футер -->
        <div class="footer">
            <p>📊 Данные обновляются автоматически | <a href="https://github.com/gitnnm/gitnnm.github.io/tree/main/telegram" target="_blank">Исходный код</a></p>
            <p style="margin-top: 10px; font-size: 0.8em;">Доступ к файлам через raw-ссылку GitHub</p>
        </div>
    </div>

    <script>
        // Конфигурация
        const REPO_OWNER = 'gitnnm';
        const REPO_NAME = 'gitnnm.github.io';
        const BRANCH = 'main';
        const TELEGRAM_PATH = 'telegram';

        // Функция для получения списка файлов через GitHub API
        async function getTelegramFiles() {
            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TELEGRAM_PATH}?ref=${BRANCH}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                
                const data = await response.json();
                return data.filter(item => item.type === 'dir');
            } catch (error) {
                console.error('Error fetching from GitHub API:', error);
                // Fallback: если API не работает, показываем сообщение об ошибке
                return null;
            }
        }

        // Функция для получения содержимого JSON файла
        async function getJsonContent(downloadUrl) {
            try {
                const response = await fetch(downloadUrl);
                if (!response.ok) return null;
                return await response.json();
            } catch {
                return null;
            }
        }

        // Форматирование даты
        function formatDate(date) {
            return new Date(date).toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Функция для создания URL raw-файла
        function getRawUrl(folder, filename) {
            return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${TELEGRAM_PATH}/${folder}/${filename}`;
        }

        // Функция для создания ссылки на GitHub
        function getGithubUrl(folder, filename) {
            return `https://github.com/${REPO_OWNER}/${REPO_NAME}/blob/${BRANCH}/${TELEGRAM_PATH}/${folder}/${filename}`;
        }

        // Основная функция загрузки и отображения данных
        async function loadTelegramArchives() {
            const channelsContainer = document.getElementById('channels-container');
            const channelsCountSpan = document.getElementById('channels-count');
            const filesCountSpan = document.getElementById('files-count');
            const messagesCountSpan = document.getElementById('messages-count');
            const updateTimeSpan = document.getElementById('update-time');

            try {
                const folders = await getTelegramFiles();
                
                if (!folders || folders.length === 0) {
                    channelsContainer.innerHTML = `
                        <div class="empty-state">
                            <h3>Нет доступных архивов</h3>
                            <p>Архивы появятся после первого парсинга каналов</p>
                        </div>
                    `;
                    updateTimeSpan.innerHTML = `🕐 ${formatDate(new Date())}`;
                    return;
                }

                let totalFiles = 0;
                let totalMessages = 0;
                let channelsHtml = '';

                // Обрабатываем каждую папку (канал)
                for (const folder of folders) {
                    try {
                        // Получаем список JSON файлов в папке
                        const folderContentsUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TELEGRAM_PATH}/${folder.name}?ref=${BRANCH}`;
                        const folderResponse = await fetch(folderContentsUrl);
                        
                        if (!folderResponse.ok) continue;
                        
                        const folderContents = await folderResponse.json();
                        const jsonFiles = folderContents
                            .filter(f => f.name.endsWith('-messages.json'))
                            .sort((a, b) => b.name.localeCompare(a.name)); // Сортируем по убыванию (новые года сверху)

                        if (jsonFiles.length === 0) continue;

                        totalFiles += jsonFiles.length;
                        
                        // Формируем HTML для канала
                        let yearsHtml = '';
                        
                        for (const jsonFile of jsonFiles) {
                            const year = jsonFile.name.replace('-messages.json', '');
                            
                            // Пытаемся получить количество сообщений
                            let messageCount = 0;
                            try {
                                const content = await getJsonContent(jsonFile.download_url);
                                messageCount = content ? content.length : 0;
                                totalMessages += messageCount;
                            } catch {
                                // Если не удалось получить, показываем прочерк
                            }

                            const rawUrl = getRawUrl(folder.name, jsonFile.name);
                            const githubUrl = getGithubUrl(folder.name, jsonFile.name);

                            yearsHtml += `
                                <div class="year-card">
                                    <a href="${rawUrl}" target="_blank" class="year-link" title="Открыть raw файл">
                                        <span class="year-number">${year}</span>
                                        <div class="year-stats">
                                            <span>📝 ${messageCount ? messageCount + ' сообщ.' : 'загрузка...'}</span>
                                            <span class="message-count">📥 raw</span>
                                        </div>
                                    </a>
                                    <a href="${githubUrl}" target="_blank" class="raw-link" title="Просмотр на GitHub">👁️ просмотр</a>
                                </div>
                            `;
                        }

                        // Название канала (пытаемся сделать красивым из имени папки)
                        let channelName = folder.name
                            .split('-')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');

                        channelsHtml += `
                            <div class="channel-card">
                                <div class="channel-header">
                                    <div class="channel-icon">📢</div>
                                    <div class="channel-info">
                                        <h2>${channelName}</h2>
                                        <div class="channel-folder">${folder.name}</div>
                                    </div>
                                </div>
                                <div class="years-container">
                                    ${yearsHtml}
                                </div>
                            </div>
                        `;
                    } catch (error) {
                        console.error(`Error processing folder ${folder.name}:`, error);
                    }
                }

                // Обновляем статистику
                channelsCountSpan.textContent = folders.length;
                filesCountSpan.textContent = totalFiles;
                messagesCountSpan.textContent = totalMessages.toLocaleString();
                updateTimeSpan.innerHTML = `🕐 ${formatDate(new Date())}`;

                // Обновляем контейнер
                channelsContainer.innerHTML = channelsHtml || `
                    <div class="empty-state">
                        <h3>Нет доступных архивов</h3>
                        <p>JSON файлы не найдены в папках</p>
                    </div>
                `;

            } catch (error) {
                console.error('Error loading archives:', error);
                channelsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>Ошибка загрузки</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 20px; font-size: 0.9em;">
                            🔧 Проверьте:<br>
                            1. Репозиторий существует<br>
                            2. Папка telegram содержит JSON файлы<br>
                            3. GitHub API доступен
                        </p>
                    </div>
                `;
            }
        }

        // Запускаем загрузку при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadTelegramArchives);
        
        // Обновляем каждые 5 минут (опционально)
        setInterval(loadTelegramArchives, 5 * 60 * 1000);
    </script>
</body>
</html>
